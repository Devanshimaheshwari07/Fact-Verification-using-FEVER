project:
  name: "FEVER Fact Verification & Information Retrieval System"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  sample_data_dir: "data/sample"
  index_dir: "artifacts/indexes"
  model_dir: "artifacts/models"
  results_dir: "artifacts/results"
  db_path: "artifacts/results/fever_ir.db"
  log_path: "artifacts/results/fever_system.log"

preprocessing:
  lowercase: true
  remove_stopwords: false  # Stopwords like 'not', 'no', 'never' are critical in fact verification
  use_stemming: true
  stemmer_type: "porter"   # "porter" or "snowball"
  min_token_length: 2
  preserve_case_for_entities: true

retrieval:
  default_method: "bm25"
  candidate_pool_size: 50
  top_k: 5
  bm25:
    k1: 1.5
    b: 0.75
    epsilon: 0.25
  tfidf:
    ngram_range: [1, 2]
    max_features: 50000
    sublinear_tf: true
  semantic:
    model_name: "all-MiniLM-L6-v2"
    device: "cpu"
    batch_size: 32
    enabled: false

verification:
  classifier_type: "logistic_regression"  # Options: logistic_regression, random_forest, mlp
  random_state: 42
  max_iter: 1000
  class_weight: "balanced"
  confidence_threshold_nei: 0.40
  feature_weights:
    tfidf_sim: 1.0
    lexical_overlap: 1.0
    negation_mismatch: 1.5
    numeric_mismatch: 1.2
    length_ratio: 0.5

evaluation:
  top_k_list: [1, 3, 5, 10]
  eval_split: "dev"
  sample_eval_size: 500
